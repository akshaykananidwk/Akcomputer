plugins { id 'com.android.application' version '8.5.2' }

android {
    namespace 'in.akdwk.shop'
    compileSdk 34

    defaultConfig {
        applicationId "in.akdwk.shop"
        minSdk 24           // Android 7 and up - covers the phones in use
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    // A signed apk is the only kind Android will install. The key lives in
    // the repo deliberately: this app is handed out by the shop itself, not
    // published on Play, and a key nobody can find is a key nobody can use
    // to ship the next version.
    signingConfigs {
        release {
            storeFile file("../akshop.keystore")
            storePassword "akshop2026"
            keyAlias "akshop"
            keyPassword "akshop2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug { signingConfig signingConfigs.release }
    }

    // Lint pulls its own jars off the network at build time; a shop building
    // this on a slow line does not need the build to fail over that.
    lint { checkReleaseBuilds false; abortOnError false }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // the web app IS the app
    sourceSets { main { assets.srcDirs += ['../www_assets'] } }
}

// ...and www_assets is a COPY of mobile/www, refreshed on every build, never
// edited by hand. Keeping a second hand-maintained copy is how an apk ends up
// shipping last week's billing screen while the tested one sits next to it.
// Sync (not Copy) also deletes files that were removed from mobile/www.
def syncWww = tasks.register('syncWww', Sync) {
    from "$rootDir/www"
    into "$rootDir/www_assets/www"
}
tasks.named('preBuild') { dependsOn syncWww }
